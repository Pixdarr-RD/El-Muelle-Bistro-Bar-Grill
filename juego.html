<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Come Bolas - PIXDARR</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  height: 100%;
  font-family: Arial, sans-serif;
}

canvas {
  display: none;
  background: #111;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
}

button {
  padding: 14px 28px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  background: yellow;
  cursor: pointer;
  margin-top: 20px;
}

.back-btn {
  position: fixed;
  top: 15px;
  right: 20px;
  color: white;
  text-decoration: none;
  font-size: 16px;
  background: rgba(0,0,0,0.5);
  padding: 8px 14px;
  border-radius: 20px;
  z-index: 999;
  transition: 0.3s ease;
}

.back-btn:hover {
  background: yellow;
  color: black;
}

</style>
</head>

<body>

<a href="index.html" class="back-btn">← Volver</a>

<div id="startScreen" class="screen">
  <h1>🎮 TRAGA BOLAS</h1>
  <p>Toca la pantalla o usa flechas</p>
  <p style="position:absolute; bottom:15px; font-size:12px; opacity:0.5;">
© 2026 PIXDARR
</p>
  <button onclick="startGame()">Empezar</button>
</div>

<div id="endScreen" class="screen" style="display:none;">
  <h2 id="finalScore"></h2>
  <button onclick="restartGame()">Reiniciar Juego</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");
const endScreen = document.getElementById("endScreen");
const finalScoreText = document.getElementById("finalScore");

let player, balls, score, gameRunning;
let keys = {};
let mouse = { x: 0, y: 0 };
let level = 1;

// 🔥 Ajustar tamaño pantalla completa
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function initGame() {
  player = { 
    x: canvas.width / 2, 
    y: canvas.height / 2, 
    radius: Math.min(canvas.width, canvas.height) * 0.03,
    speed: Math.min(canvas.width, canvas.height) * 0.005
  };

  balls = [];
  score = 0;
  gameRunning = true;

  let totalBalls = 20 + (level * 10);

  for (let i = 0; i < totalBalls; i++) {
    balls.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: player.radius * 0.4
    });
  }
}

function startGame() {
  startScreen.style.display = "none";
  endScreen.style.display = "none";
  canvas.style.display = "block";
  initGame();
  gameLoop();
}

function restartGame() {
  level++;
  startGame();
}

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

canvas.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

canvas.addEventListener("touchmove", e => {
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
});

function update() {
  if (!gameRunning) return;

  if (keys["ArrowUp"]) player.y -= player.speed;
  if (keys["ArrowDown"]) player.y += player.speed;
  if (keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;

  let dx = mouse.x - player.x;
  let dy = mouse.y - player.y;
  player.x += dx * 0.05;
  player.y += dy * 0.05;

  balls = balls.filter(ball => {
    let dx = player.x - ball.x;
    let dy = player.y - ball.y;
    let distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < player.radius + ball.radius) {
      score++;
      return false;
    }
    return true;
  });

  if (balls.length === 0) {
    gameRunning = false;
    canvas.style.display = "none";
    endScreen.style.display = "flex";
    finalScoreText.innerText = 
      "Nivel " + level + " completado 🎉\nPuntos: " + score;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fillStyle = "yellow";
  ctx.fill();

  balls.forEach(ball => {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  });

  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.fillText("Nivel: " + level, 20, 30);
  ctx.fillText("Puntos: " + score, 20, 55);
}

function gameLoop() {
  update();
  draw();
  if (gameRunning) requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
